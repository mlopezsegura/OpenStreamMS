name: Build and release

# Cada push y PR a master compila el instalador y lo deja como artefacto.
# Un tag vX.Y.Z (p.ej. v1.2.0) además publica la GitHub Release con el instalador.
on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Tag v1.2.0 -> 1.2.0. Sin tag: 1.0.<nº de ejecución>, numérico para que
      # dotnet e Inno Setup lo acepten como versión.
      - name: Compute version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = "1.0.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      # build-installer.bat busca ISCC en la ruta estándar de Inno Setup 6.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: cmd
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: call Core\Installer\build-installer.bat

      - uses: actions/upload-artifact@v4
        with:
          name: OpenStreamMS-Setup-${{ steps.version.outputs.version }}
          path: Core/dist/OpenStreamMS-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenStreamMS-Setup-${{ needs.build.outputs.version }}

      - uses: softprops/action-gh-release@v2
        with:
          name: OpenStreamMS ${{ needs.build.outputs.version }}
          files: OpenStreamMS-Setup-${{ needs.build.outputs.version }}.exe
          generate_release_notes: true
          # Tags con guion (v1.2.0-beta.1) salen como pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
