<!doctype html>
<!-- Imagen grande de la bienvenida y del final (WizardImageFile) y logo pequeño de las demás
     páginas (WizardSmallImageFile), con fondo transparente para que se vea el fondo animado.
     generate-art.ps1 lo captura con Chrome sin ventana:  #hero,<ancho>,<alto> | #small,<lado>,<lado> -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { display: grid; place-items: center; }
  .logo { position: relative; width: var(--s); height: var(--s); }
  .logo svg { position: relative; width: 100%; height: 100%; filter: drop-shadow(0 calc(var(--s) * .08) calc(var(--s) * .18) rgba(124,58,237,.45)); }
  .ring { position: absolute; inset: 0; border-radius: 30%; border: calc(var(--s) * .025) solid rgba(139,92,246,.35); }
  .r1 { transform: scale(1.35); opacity: .7; } .r2 { transform: scale(1.75); opacity: .4; } .r3 { transform: scale(2.2); opacity: .18; }
  .small .ring { display: none; }
  .small .logo svg { filter: none; }
</style>
</head>
<body>
<div class="logo">
  <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
  <!-- Misma geometría que wwwroot/favicon.svg y app.ico (lienzo 32, radio 7). -->
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient></defs>
    <rect width="32" height="32" rx="7" fill="url(#g)"/><path d="M12 9l11 7-11 7z" fill="#fff"/>
  </svg>
</div>
<script>
  // Chrome sin ventana no baja de ~500 px de ancho: el tamaño real llega en el hash.
  const [kind, w, h] = location.hash.slice(1).split(',');
  const small = kind === 'small';
  document.body.classList.toggle('small', small);
  Object.assign(document.body.style, { width: `${w}px`, height: `${h}px`, position: 'absolute', left: 0, top: 0 });
  document.documentElement.style.setProperty('--s', `${(small ? .84 : .34) * Math.min(w, h)}px`);
</script>
</body>
</html>
